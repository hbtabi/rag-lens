[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lens"
version = "0.1.0"
description = "Retrieval-augmented Q&A over local docs with BM25, optional embeddings, citations and a retrieval-quality eval."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hassan bin Tayyeb", email = "hasaantayyb1@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["rag", "bm25", "retrieval", "llm", "question-answering", "embeddings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
rag-lens = "raglens.cli:main"

[project.urls]
Homepage = "https://github.com/hbtabi/rag-lens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
